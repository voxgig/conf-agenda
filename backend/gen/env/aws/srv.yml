agenda:
  handler: dist/handler/lambda/agenda.handler
  role: BasicConfAgendaLambdaRole
  timeout: 30
  memorySize: 1024
  events:
    - http:
        path: "/api/public/agenda"
        method: POST
        cors: false





auth:
  handler: dist/handler/lambda/auth.handler
  role: BasicConfAgendaLambdaRole
  timeout: 30
  memorySize: 1024
  events:
    - http:
        path: "/api/public/auth"
        method: POST
        cors: false





cag:
  handler: dist/handler/lambda/cag.handler
  role: BasicConfAgendaLambdaRole
  timeout: 30
  memorySize: 1024
  events:
    - http:
        path: "/api/private/cag"
        method: POST
        cors: false


