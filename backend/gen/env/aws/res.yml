# START



BasicConfAgendaLambdaRole:
  Type: AWS::IAM::Role
  Properties:
    RoleName: BasicConfAgendaLambdaRole${self:custom.index.BasicLambdaRole,"01"}
    AssumeRolePolicyDocument:
      Version: '2012-10-17'
      Statement:
        - Effect: Allow
          Principal:
            Service:
              - lambda.amazonaws.com
              - events.amazonaws.com
              - ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
    Policies:
      - PolicyName: LambdaServiceAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:DescribeTable
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource: 


    ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

# END
